name: ci

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      export_images:
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to validate
        type: choice
        default: all
        options: [all, windows, linux, macos, macos-package, docker]
      export_images:
        description: Save verified container images for release preparation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "3"

jobs:
  windows-msvc:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend contract and client
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -I packaging/validate_integration.py
          python -I packaging/test_release.py
          node --test examples/frontend/client.test.mjs
      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --version || exit /b 1
          where cl || exit /b 1
          cmake --preset windows-msvc-debug || exit /b 1
          cmake --build --preset windows-msvc-debug || exit /b 1
          ctest --preset windows-msvc-debug --timeout 120 || exit /b 1
      - name: Upstream HTTPS through the system trust store
        shell: pwsh
        env:
          MUSIC_SERVICE_ONLINE_TESTS: "1"
        run: out/build/windows-msvc-debug/tests/music_service_integration_tests.exe "[online]"
      - name: Runtime smoke test
        shell: pwsh
        run: packaging/windows/smoke.ps1 -Binary out/build/windows-msvc-debug/src/server/music-service.exe
      - name: Frontend HTTP, CORS and SSE integration
        shell: pwsh
        run: node packaging/frontend_smoke.mjs out/build/windows-msvc-debug/src/server/music-service.exe
      - name: Release package
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset windows-msvc-release || exit /b 1
          cmake --build --preset windows-msvc-release --target package || exit /b 1
      - name: Package smoke test
        shell: pwsh
        run: packaging/windows/package_smoke.ps1 -Package (Get-Item out/build/windows-msvc-release/music-service-*.zip).FullName -RequireImportCheck
      - name: Windows service smoke test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'package'
          Expand-Archive (Get-Item out/build/windows-msvc-release/music-service-*.zip).FullName $dir
          packaging/windows/service_smoke.ps1 -PackageDir (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
      - name: Stage verified Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/package | Out-Null
          Copy-Item out/build/windows-msvc-release/music-service-*.zip out/package/
          python -I packaging/release.py checksums out/package
      - uses: actions/upload-artifact@v4
        with:
          name: music-service-windows-x86_64
          path: out/package/*
          if-no-files-found: error
          retention-days: 14
      - name: Save Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            out/build/windows-msvc-*/CMakeFiles/CMakeConfigureLog.yaml
            out/build/windows-msvc-*/CMakeFiles/fc-stamp/**/*
            out/build/windows-msvc-*/Testing/Temporary/*
          retention-days: 14
      # Live Kuwo from an overseas runner may be refused by region; the offline gate
      # ([gate] in ctest) is the required check, this step records what the network allows.
      - name: Kuwo online loop
        continue-on-error: true
        shell: pwsh
        run: python -I packaging/e2e/kuwo_e2e.py --binary out/build/windows-msvc-debug/src/server/music-service.exe
      - name: 5sing online loop
        continue-on-error: true
        shell: pwsh
        run: python -I packaging/e2e/kuwo_e2e.py --binary out/build/windows-msvc-debug/src/server/music-service.exe --source fivesing

  linux-gcc:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux'
    name: linux-gcc (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure, build and test
        run: |
          cmake --version
          g++ --version
          ldd --version | sed -n '1p'
          cmake --preset linux-gcc-debug
          cmake --build --preset linux-gcc-debug
          ctest --preset linux-gcc-debug --timeout 120
      - name: Upstream HTTPS through the system CA files
        env:
          MUSIC_SERVICE_ONLINE_TESTS: "1"
        run: out/build/linux-gcc-debug/tests/music_service_integration_tests "[online]"
      - name: Runtime smoke test
        run: packaging/linux/smoke.sh out/build/linux-gcc-debug/src/server/music-service
      - name: Frontend HTTP, CORS and SSE integration
        run: node packaging/frontend_smoke.mjs out/build/linux-gcc-debug/src/server/music-service
      - name: Release package and systemd service
        run: |
          cmake --preset linux-gcc-release
          cmake --build --preset linux-gcc-release --target package
          sudo bash packaging/linux/package_smoke.sh out/build/linux-gcc-release/music-service-*.tar.gz --service
      - name: Stage verified Linux package
        run: |
          mkdir -p out/package
          cp out/build/linux-gcc-release/music-service-*.tar.gz out/package/
          python3 -I packaging/release.py checksums out/package
      - uses: actions/upload-artifact@v4
        with:
          name: music-service-linux-${{ matrix.arch }}
          path: out/package/*
          if-no-files-found: error
          retention-days: 14
      - name: Kuwo online loop
        continue-on-error: true
        run: python3 -I packaging/e2e/kuwo_e2e.py --binary out/build/linux-gcc-debug/src/server/music-service
      - name: 5sing online loop
        continue-on-error: true
        run: python3 -I packaging/e2e/kuwo_e2e.py --binary out/build/linux-gcc-debug/src/server/music-service --source fivesing

  macos-clang:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos' || inputs.target == 'macos-package'
    name: macos-clang (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install cmake ninja llvm@20
          echo "MUSIC_SERVICE_LLVM_ROOT=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"
      - name: Configure, build and test
        if: inputs.target != 'macos-package'
        run: |
          cmake --version
          "$MUSIC_SERVICE_LLVM_ROOT/bin/clang++" --version
          sw_vers
          uname -m
          cmake --preset macos-clang-debug
          cmake --build --preset macos-clang-debug --parallel 3
          ctest --preset macos-clang-debug --timeout 120
      - name: Upstream HTTPS through the system Keychain
        if: inputs.target != 'macos-package'
        env:
          MUSIC_SERVICE_ONLINE_TESTS: "1"
        run: out/build/macos-clang-debug/tests/music_service_integration_tests "[online]"
      - name: Runtime smoke test
        if: inputs.target != 'macos-package'
        run: bash packaging/linux/smoke.sh out/build/macos-clang-debug/src/server/music-service
      - name: Frontend HTTP, CORS and SSE integration
        if: inputs.target != 'macos-package'
        run: node packaging/frontend_smoke.mjs out/build/macos-clang-debug/src/server/music-service
      - name: Release package
        run: |
          python3 -I packaging/macos/test_bundle_runtime.py
          cmake --preset macos-clang-release
          cmake --build --preset macos-clang-release --target package
      - name: Kuwo online loop
        if: inputs.target != 'macos-package'
        continue-on-error: true
        run: python3 -I packaging/e2e/kuwo_e2e.py --binary out/build/macos-clang-debug/src/server/music-service
      - name: 5sing online loop
        if: inputs.target != 'macos-package'
        continue-on-error: true
        run: python3 -I packaging/e2e/kuwo_e2e.py --binary out/build/macos-clang-debug/src/server/music-service --source fivesing
      - name: Package and launchd smoke test without Homebrew LLVM
        run: |
          # Hide the actual keg as well as opt symlinks for this isolated runner.
          llvm_real=$(cd "$MUSIC_SERVICE_LLVM_ROOT" && pwd -P)
          llvm_hidden="${llvm_real}.music-service-package-test"
          test ! -e "$llvm_hidden"
          mv "$llvm_real" "$llvm_hidden"
          trap 'mv "$llvm_hidden" "$llvm_real"' EXIT
          bash packaging/macos/package_smoke.sh out/build/macos-clang-release/music-service-*.tar.gz
      - name: Package checksums
        working-directory: out/build/macos-clang-release
        run: shasum -a 256 music-service-*.tar.gz > SHA256SUMS
      - name: Save verified macOS package
        uses: actions/upload-artifact@v4
        with:
          name: music-service-macos-${{ matrix.arch }}
          path: |
            out/build/macos-clang-release/music-service-*.tar.gz
            out/build/macos-clang-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'docker'
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          docker build --build-arg BUILD_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f packaging/docker/Dockerfile -t music-service:ci .
      - name: Container smoke test
        run: packaging/docker/smoke.sh music-service:ci
      - name: Export verified container image
        if: inputs.export_images
        run: |
          mkdir -p out/image
          docker save music-service:ci --output "out/image/music-service-image-${{ matrix.arch }}.tar"
          python3 -I packaging/release.py checksums out/image
      - uses: actions/upload-artifact@v4
        if: inputs.export_images
        with:
          name: music-service-image-${{ matrix.arch }}
          path: out/image/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Kuwo online loop in the container
        continue-on-error: true
        run: packaging/docker/e2e.sh music-service:ci
      - name: 5sing online loop in the container
        continue-on-error: true
        run: packaging/docker/e2e.sh music-service:ci --source fivesing
